name: build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and nightly formatter
        run: |
          rustup show
          rustup toolchain install nightly --profile minimal --component rustfmt
      - name: Build and verify CPU, offline, and image operators
        run: make verify-cpu verify-artifacts
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install policy tools
        run: cargo install cargo-audit cargo-deny --locked
      - name: Audit dependency policy
        run: |
          cargo audit --ignore RUSTSEC-2024-0436
          cargo deny check
