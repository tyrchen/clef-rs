[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Tyr Chen"]
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/"
repository = "https://github.com/tyrchen/clef-rs"
homepage = "https://github.com/tyrchen/clef-rs"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2024_compatibility = { level = "warn", priority = -1 }
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
safetensors = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
sha2 = "0.11"
fs4 = "1.1"
secrecy = "0.10"
url = "2.5"
bytes = "1.12"
tracing = "0.1"
typed-builder = "0.23"
clap = { version = "4.6", features = ["derive"] }
axum = "0.8"
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
yaml-rust2 = "0.11"
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
turbojpeg = { version = "1.5.1", default-features = false }
base64 = "0.22"
tempfile = "3"
proptest = "1.11"
rstest = "0.27"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
clef-rs-core = { path = "crates/core", default-features = false }
