[package]
name = "clef-rs-server"
description = "Authenticated local CLEF decision server and artifact CLI"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
documentation.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "clef"
path = "src/main.rs"

[features]
default = ["hub"]
hub = ["clef-rs-core/hub"]
cuda = ["clef-rs-core/cuda"]
metal = ["clef-rs-core/metal"]
vision = ["clef-rs-core/vision"]

[lints]
workspace = true

[dependencies]
clef-rs-core = { workspace = true, default-features = false }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
axum.workspace = true
tower.workspace = true
config.workspace = true
yaml-rust2.workspace = true
jsonwebtoken.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
